---
- name: Configure OSPF
  hosts: routers
  gather_facts: false

  tasks:
    - name: Configure interface status and descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: true
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Save config

    - name: Configure IP addresses
      cisco.ios.ios_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            ipv4:
              - address: "{{ item.ip }}"
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Save config

    - name: Configure OSPF on interfaces
      cisco.ios.ios_ospf_interfaces:
        config:
          - name: "{{ item.name }}"
            address_family:
              - afi: ipv4
                process:
                  id: 1
                  area_id: "{{ item.area }}"
                network:
                  point_to_point: "{{ true if not item.passive else omit }}"
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Save config

    - name: Configure OSPF process
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: 1
              router_id: "{{ router_id }}"
              passive_interfaces:
                interface:
                  set_interface: true
                  name: "{{ interfaces | selectattr('passive') | map(attribute='name') | list }}"
      notify: Save config

  handlers:
    - name: Save config
      cisco.ios.ios_config:
        save_when: always